# errata.yml — structured errata source for ZalizniakKonspekt_2004
#
# GENERATED target: ERRATA.mdx (via scripts/build_errata.py / `npm run errata`) — never edit ERRATA.mdx.
#
# This book has no printed errata sheet catalogued yet. Add corrections either by:
#   A. transcribing a printed errata/opechatki sheet (see KnauerFrazy_1908/errata.yml for the shape), or
#   B. edition diff — when this book's text file changes, run:
#        python scripts/build_errata.py diff ZalizniakKonspekt_2004 <old-git-ref> [<new-git-ref>]
#      then fold reviewed candidates from errata.candidates.yml into `entries` below.
#
# Entry shape: { page, line, read, instead, found_by, date_added, fixed_in?, note? }
#
# tier:    (optional) erratum (default) | revision | retraction — the ACL
#          three-tier corrections model (https://aclanthology.org/info/corrections/).
# revises: (revision only) the `id` of the entry this one replaces — its own
#          id becomes `<that-id>.v2` (or `.v3`, ... for a chain).
# reason:  (retraction only) why this entry is withdrawn.
# id / date / checksum are never hand-authored — build_errata.py computes them.

work: "Zalizniak, grammar conspectus (2004)"

entries: []
