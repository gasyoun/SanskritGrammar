# errata.yml — structured errata source for KocherginaUchebnik_1998
#
# GENERATED target: ERRATA.mdx (via scripts/build_errata.py / `npm run errata`) — never edit ERRATA.mdx.
#
# This book has no printed errata sheet catalogued yet. Add corrections either by:
#   A. transcribing a printed errata/opechatki sheet (see KnauerFrazy_1908/errata.yml for the shape), or
#   B. edition diff — when this book's text file changes, run:
#        python scripts/build_errata.py diff KocherginaUchebnik_1998 <old-git-ref> [<new-git-ref>]
#      then fold reviewed candidates from errata.candidates.yml into `entries` below.
#
# Entry shape: { page, line, read, instead, edition, found_by, date_added, fixed_in?, note?,
#                kind?, locus? }
#
# kind:   print (default) | digitization — WHAT is being corrected. `print` corrects the
#         printed edition; `digitization` corrects our own extraction and claims nothing
#         about the paper book. Orthogonal to `tier`; rendered as its own column so the
#         two can be sorted apart before reconciling against a physical copy.
# locus:  (digitization only) where the fix was applied — file + line in the generated
#         .mdx plus the `w14:paraId` inside the .docx. Shown in the Line/locus column,
#         and part of the dedup key + checksum, since digitization rows share an empty
#         (page, line) and may share the same read/instead pair.
#
# tier:    (optional) erratum (default) | revision | retraction — the ACL
#          three-tier corrections model (https://aclanthology.org/info/corrections/).
# revises: (revision only) the `id` of the entry this one replaces — its own
#          id becomes `<that-id>.v2` (or `.v3`, ... for a chain).
# reason:  (retraction only) why this entry is withdrawn.
# id / date / checksum are never hand-authored — build_errata.py computes them.
#
# `edition` (added by H807, 16-07-2026): which physical printing the page/line refs point at.
#   Pin per K-1 (RESOLVED by MG 12-07-2026): the reference edition is the 1998 original —
#   use edition: "1998". Later printings (2017 6th ed. Лихушина; 2024/2025) get their own
#   value when MG supplies the scans (edition-diff pass, Decision C in
#   METODICHKA_KOCHERGINA_COMPANION_2026.md §4.3). build_errata.py ignores unknown fields,
#   so the column is forward-compatible; the renderer picks it up when multi-edition rows exist.
#
# SEED STATUS (H807, 16-07-2026; reaffirmed H1454, 26-07-2026): entries deliberately left EMPTY.
# No printed errata sheet is catalogued, no second-edition scan exists to diff against, and the
# digitized .mdx alone cannot distinguish a 1998 print typo from a digitization artifact —
# inventing rows would violate the "do not invent errata" guardrail. First real rows come from
# either (A) a printed sheet transcription or (B) a build_errata.py diff once a second edition
# text lands.
#
# H1454 / visa #razdel-1-frame (MG): author census — «750+ typos in 1998/2015 printing,
# ≥50 still in 2024 reprint» — is recorded as a visa note in
# METODICHKA_KOCHERGINA_V1_KOMMENTARII_2026.md, NOT expanded into invented page/line rows.
# Disposition: DEFERRED until print/scans + K-1 edition pin.
# NOTE the open caveat: LEARNER_MATERIALS.md records the digitized copy as the 2017 6th ed.
# (ред. Н. П. Лихушина) while K-1 pins errata refs to 1998 — if the .mdx is later shown to
# transcribe the 2017 text, re-open K-1 before citing any page/line.

work: "Kochergina, Sanskrit textbook (Учебник санскрита, 1998)"

# ---------------------------------------------------------------------------
# `kind: digitization` — corrections to OUR extraction, not to the 1998 print.
#
# These do NOT violate the "do not invent errata" guardrail above, because they
# claim nothing about the printed page: each one records that the digitized
# source disagreed with ITSELF (a marker set without its dot while its own
# siblings in the same lesson carry one). They are filed here, in the same
# table, so there is a single list of every replacement — `kind` is the column
# to sort on when the print/digitization distinction matters.
#
# `page` is deliberately empty: we do not know the printed page. `locus` gives
# the position in the generated .mdx plus the paragraph id inside the .docx,
# which is where the fix was actually applied.
# ---------------------------------------------------------------------------
entries:
