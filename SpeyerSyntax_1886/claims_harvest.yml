  - {id: SPE-H-22, topic: address,   source_line: 16113, quantifier: "как правило", kind: rule, testability: reference-Whitney, claim_en: "Addressing a person by a kinship or professional title shows, as a rule, greater respect than using the generic word for 'lord/sir'; unlike the generic term, such titles can denote the third person as well as the second."}
  - {id: SPE-H-23, topic: pronoun,   source_line: 17280, quantifier: "редко / как правило", kind: typology, testability: syntax-treebank, claim_en: "The pronoun idam/ayam ('this') is seldom used inside compounds; when a compound of this sense is needed, tyad or etad is substituted, as a rule, instead."}
  - {id: SPE-H-24, topic: pronoun,   source_line: 17424, quantifier: "как правило", kind: rule, testability: syntax-treebank, claim_en: "In classical Sanskrit, the interrogative pronoun ka- used as a pure indefinite ('someone, anyone') is, as a rule, combined with a further particle rather than standing alone."}
  - {id: SPE-H-25, topic: particle,  source_line: 25662, quantifier: "как правило", kind: rule, testability: syntax-treebank, claim_en: "When negation is combined with a connective particle (ca, vā, tu), the negative na, as a rule, precedes the particle rather than following it."}
  - {id: SPE-H-26, topic: particle,  source_line: 27838, quantifier: "всегда", kind: rule, testability: syntax-treebank, claim_en: "The particle hi is exceedingly frequent, and is always added when the sentence draws an inference or conclusion."}
  - {id: SPE-H-27, topic: particle,  source_line: 27923, quantifier: "как правило", kind: rule, testability: syntax-treebank, claim_en: "When a negative clause is linked to a following affirmative clause, the negation, as a rule, precedes the connective particle joining them."}

