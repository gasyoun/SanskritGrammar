  - {id: SPE-H-10, topic: ablative,  source_line: 4125, quantifier: "всегда избегается", kind: statistic, testability: morphology-DCS, claim_en: "The causal ablative built with the special feminine ending is, as a rule, always avoided in practice."}
  - {id: SPE-H-11, topic: genitive,  source_line: 5231, quantifier: "всегда",  kind: government,  testability: syntax-treebank,   claim_en: "Action nouns (bhāvavacana / nomina actionis) doing duty for an infinitive are nonetheless always felt as true noun-cases, and so still take the genitive government of their underlying verb rather than an infinitive's own construction."}

  # ===== Compounding (source: lines ~9324-15788) =====
  - {id: SPE-H-12, topic: compounding, source_line: 9324, quantifier: "как правило", kind: rule, testability: syntax-treebank, claim_en: "A postposed case-governing particle that always stands before its noun is nonetheless, as a rule, also allowed to be compounded with that noun, the particle then forming the first member."}
  - {id: SPE-H-13, topic: word-order, source_line: 10676, quantifier: "как правило", kind: rule, testability: syntax-treebank, claim_en: "The particle api is, as a rule, placed after (behind) the noun it qualifies, at least in prose."}
  - {id: SPE-H-14, topic: compounding, source_line: 12813, quantifier: "как правило", kind: universality, testability: syntax-treebank, claim_en: "As a rule, any genitive relation may be expressed as a compound (ṣaṣṭhī-tatpuruṣa)."}
  - {id: SPE-H-15, topic: compounding, source_line: 12817, quantifier: "не допускается", kind: rule, testability: syntax-treebank, claim_en: "A genitive is not allowed to be compounded with a following participle, gerund, gerundive (kṛtya), or infinitive."}
  - {id: SPE-H-16, topic: compounding, source_line: 12821, quantifier: "не допускается", kind: rule, testability: syntax-treebank, claim_en: "A genitive is not allowed to be compounded with a following comparative, superlative, or ordinal-number word."}
  - {id: SPE-H-17, topic: compounding, source_line: 12833, quantifier: "как правило исключены", kind: rule, testability: syntax-treebank, claim_en: "Partitive genitives, and the dative-like ('purpose') genitive, are as a rule excluded from compounding."}
  - {id: SPE-H-18, topic: compounding, source_line: 14429, quantifier: "как правило", kind: typology, testability: reference-Whitney, claim_en: "Bahuvrīhi compounds in -mātra ('whose exact measure is X') are, as a rule, used as if their final member functioned as a restrictive particle meaning 'only, but'."}
  - {id: SPE-H-19, topic: adverbial-case, source_line: 15154, quantifier: "как правило", kind: rule, testability: morphology-DCS, claim_en: "When an adjective is used adverbially, the accusative of the neuter singular is, as a rule, the form employed."}
  - {id: SPE-H-20, topic: compounding, source_line: 15788, quantifier: "как правило", kind: rule, testability: syntax-treebank, claim_en: "In the reduplicated-noun idiom (e.g. 'day by day'), the case-endings of the first member are, as a rule, retained rather than reduced to a compound stem."}

  # ===== Pronouns / particles (source: lines ~16113-27923) =====
