summary_ru: 'Очерк §61: открытый корень кончается чередующимся элементом (sthā, i,
  śru), закрытый имеет после него согласную (chid, iṣ). Конспект 2004 повторяет деление.
  Уитни описывает те же исходы корня без этой пары терминов. Деление важно для выбора
  сильной/слабой основы и для seṭ.'
