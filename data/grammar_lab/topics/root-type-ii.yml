summary_ru: 'Тип II держит guṇa там, где тип I даёт нуль: jñātaḥ, not *jñitaḥ; gaditaḥ.
  Конспект 2004 называет часть таких корней неполноизменяемыми. Уитни описывает те
  же формы как отсутствие ослабления, без типа II.'
