summary_ru: 'Статья 1975 вводит три морфологические позиции: 1 ждёт нулевую ступень
  (причастие на -ta, слабый перфект), 2 — guṇa (инфинитив, будущее), 3 — vṛddhi (часть
  сигматического аориста и каузатива). Уитни описывает те же формы через strong/middle/weakest
  и отдельные правила усиления; нумерованных позиций у него нет. Очерк 1978 и конспект
  2004 эту примитивацию снимают.'
alignment_note: 1975-only primitive. Whitney/1978/2004 are descriptive counterparts,
  not the same calculus.
