summary_ru: 'Одинаковое написание не есть один корень: as «быть» (тип I) и as «бросать»
  (тип II); vas «сиять» / vas «одевать». Уитни нумерует омонимы в Roots (whitney_no
  22 vs 23). Свёртка DCS-частоты по омонимам в pin-срезе — ограничение снимка, не
  доказательство тождества.'
