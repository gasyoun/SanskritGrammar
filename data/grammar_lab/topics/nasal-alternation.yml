summary_ru: Ряды M/N Зализняка описывают gam / gataḥ, man / mataḥ, tan / tataḥ и сдвиги
  между носовым рядом и A1 (daṃś / daśati). Уитни даёт те же формы по классам и по
  PPP, не собирая их в ряды M/N. Часть корней исторически уходит в A1 — это смена
  нормы, не «невозможность» носовой ступени.
