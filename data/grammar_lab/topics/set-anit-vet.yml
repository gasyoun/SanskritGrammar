summary_ru: Зализняк делит корни по наличию соединительного i перед согласным суффиксом
  (§63 очерка; конспект 2004). Уитни того же i называет union-vowel и описывает по
  формам (инфинитив, будущее, PPP), не вводя термины seṭ/aniṭ. Смешанный (veṭ) тип
  нельзя сводить к одному правилу.
alignment_note: Same connective i; Whitney has no seṭ/aniṭ terms.
