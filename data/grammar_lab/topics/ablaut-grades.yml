summary_ru: 'Whitney описывает guṇa и vṛddhi как последовательные усиления гласного
  (§§235–243) без нулевой ступени как члена той же шкалы. Зализняк 1975/1978/2004
  задаёт трёхчленную шкалу слабая / guṇa / vṛddhi. Это один наблюдаемый факт (три
  огласовки) и две разные модели: у Уитни нет абстракции «ряда» и нет нуля как обязательного
  третьего члена.'
alignment_note: Shared phenomenon, different models. Do not equate Whitney increment
  with 1975 position.
