summary_ru: 'Уитни §§824–920 выделяет простой, удвоенный и сигматический аористы.
  Очерк §§139–147 нумерует семь типов. 1975 использует аорист 4/5 как диагностику
  позиции 3. Нумерации не совпадают один к одному: сверять по строению основы, не
  по номеру.'
