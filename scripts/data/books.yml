# books.yml — citation registry for the digitized book corpus (Angle-B B3).
#
# Source of truth for scripts/build_bibtex.py, which regenerates
# static/bibtex/<key>.bib (one entry per book) + static/bibtex/all.bib
# (bulk). Never edit the .bib files by hand — edit this file and re-run
# `python scripts/build_bibtex.py` (CI enforces freshness via --check).
#
# Field contract:
#   dir  — the book's top-level folder; MUST be a publishable discovered
#          dir of the Docusaurus site (src/discovery.mjs rules) and its
#          _YYYY suffix MUST equal `year`.
#   key  — the stable B2 id-grammar stem `<slug>-<year>`; unique across
#          the corpus (Zalizniak's three books disambiguate by year).
#   type — BibTeX entry type: book | phdthesis | misc.
# Bibliographic facts are transcribed from each book's own evidence
# (README.md, errata.yml `work:` record, mdx title page) — never invented;
# where the repo holds no publisher/place evidence the field is omitted.
# English proper nouns carry {} case-protection; Cyrillic is case-immune.

books:
  - dir: ApteSyntax_1885
    key: apte-1885
    type: book
    author: "Apte, Vaman Shivaram"
    title: "Учебник по санскритскому синтаксису"
    year: 1885
    note: "Russian translation by {N}. {P}. {L}ikhushina; 2022 electronic edition"

  - dir: BuhlerLeitfaden_1923
    key: buhler-1923
    type: book
    author: "Bühler, Georg"
    title: "Leitfaden für den elementaren {C}ursus des {S}anskrit"
    address: "Stockholm"
    year: 1923
    note: "Russian adaptation «Руководство к элементарном курсу санскритского языка»; electronic edition v2.0 by {N}. {P}. {L}ikhushina"

  - dir: GasunsDhatu_2014
    key: gasuns-2014
    type: phdthesis
    author: "Гасунс, Марцис Юрисович"
    title: "Состав и строй древнеиндийских корней: история изучения"
    school: "Институт языкознания РАН"
    year: 2014
    note: "Кандидатская диссертация (на правах рукописи)"

  - dir: KnauerFrazy_1908
    key: knauer-1908
    type: book
    author: "Knauer, Friedrich"
    title: "Фразы (для упражненія въ грамматическихъ формахъ)"
    year: 1908
    note: "Phrase collection for grammar drills; electronic conversion 2023"

  - dir: KocherginaUchebnik_1998
    key: kochergina-1998
    type: book
    author: "Кочергина, В. А."
    title: "Учебник санскрита"
    year: 1998

  - dir: TolchelnikovTalmud_2026
    key: tolchelnikov-2026
    type: book
    author: "Толчельников, И. Э."
    title: "Руководство по санскритской морфонологии (Талмуд санскрита)"
    year: 2026
    note: "Version 2.1.6; Общество ревнителей санскрита; refactored electronic edition"

  - dir: WhitneyGrammar_1889
    key: whitney-1889
    type: book
    author: "Whitney, William Dwight"
    title: "A {S}anskrit {G}rammar, including both the {C}lassical {L}anguage and the older {D}ialects, of {V}edic"
    edition: "2"
    year: 1889
    note: "Derived facsimile generated by scripts/build_whitney.py"

  - dir: ZalizniakMorphology_1975
    key: zalizniak-1975
    type: misc
    author: "Зализняк, А. А."
    title: "Морфонологическая классификация санскритских глагольных корней"
    year: 1975
    note: "Research article; English version in this repository, translated by {I}. {T}olchelnikov, edited by {M}. {I}shimbaev"

  - dir: ZalizniakOcherk_1978
    key: zalizniak-1978
    type: book
    author: "Зализняк, А. А."
    title: "Грамматический очерк санскрита"
    address: "Москва"
    year: 1978
    note: "Appendix to {V}. {A}. {K}ochergina's «Санскритско-русский словарь»"

  - dir: ZalizniakKonspekt_2004
    key: zalizniak-2004
    type: book
    author: "Зализняк, А. А."
    title: "Конспект грамматических сведений о санскрите"
    year: 2004
