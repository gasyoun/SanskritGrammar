# sg_tooling — installable Python tooling for the SanskritGrammar monorepo.
#
# A clean environment must be able to install this and run `sg --help` without
# adding the repository root to PYTHONPATH (architecture § 5.2).

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sg-tooling"
version = "0.1.0"
description = "Pipeline, work, and provenance contracts plus the sg CLI for the SanskritGrammar monorepo."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "../../LICENSE" }
authors = [{ name = "Mārcis Gasūns" }]

# Runtime deps only. Scholarly/corpus concerns stay with their canonical owners
# (sanskrit-util, VisualDCS, csl-pyutil, WhitneyRoots) and are consumed through
# adapters — see sg_tooling.adapters.
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# The real Draft-2020-12 path. Without it the contracts layer falls back to its
# bounded builtin subset, which covers exactly the keywords these schemas use.
schema = ["jsonschema>=4.0"]

[project.scripts]
sg = "sg_tooling.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sg_tooling"]
