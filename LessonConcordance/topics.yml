  XLIV:
    title: "Будущие времена и прекатив: описательное будущее (имя деятеля на tṛ + спрягаемый as; перед tā те же изменения корня, что перед tum инфинитива); простое будущее (sya/ṣya прямо или через i/ī; guṇa подъёмных; конечные согласные как в II/III/VII перед s-; соединительный гласный как в инфинитиве; ayiṣya X-класса); причастия простого будущего (как I/IV/VI/X) и conditionalis (имперфект от простого будущего); прекатив (yās/sī, спряжение как pot. II/III/V/VII-IX; e-ряд dā/dhā/mā/sthā/pā/hā/gai…; aniṭ-изменения конечных; dhvam→ḍhvam)"
    mdx: "BuhlerLeitfaden_1923/Buhler_Unicode.mdx, строки 6733–6905 (заголовок «# УРОК XLIV.»; дальше урок XLV — обычный заголовок, mdx 6907). Русско-санскритское упражнение ЕСТЬ — вопреки косому правилу «43–47 без упражнений»: текст о калиюге (mdx 6905) с живым санскритским стержнем в Кнауэре Nr.13 (см. reuse_clusters — для матчера невидимо: упражнение Бюлера по-русски); corpus_layer возвращает 2 строки топ-100 (yā, dṛś) — обе простое будущее"
    claims: [HB-58, HB-352, HB-353, HB-354, HB-355, HB-356, HB-357, HB-358, HB-359, HB-360, HB-361, HB-362]
    reuse_clusters:
      - "Кураторская находка (вне матчера): русско-санскритское упражнение урока (калиюга, mdx 6905) имеет живой санскритский стержень в Кнауэре Nr.13 (§§ 152–154): «yadi devo varṣiṣyati vayaṁ bahir na gamiṣyāmaḥ», «kaliyuge balaṁ prāpte pralaye ca samupasthite dharmo vinaçiṣyati», «bahavo brāhmaṇā vedam utsrakṣyanti… ācariṣyanti», «apaṇyāni vikreṣyanti», «abhakṣyaṁ bhakṣayiṣyanty apeyaṁ pāsyanti» — ядро упражнения (брахманы/веды/запретные товары/недозволенная еда) совпадает дословно; обрамление разное (у Бюлера дальше шудры, Явана-Щака, осада городов — в Nr.13 нет). Матчер молчит: пары «русский текст ↔ санскритский текст» вне дифф-матчера matches.json — преподнесение упражнения Бюлера по-русски прячет пересечение (для серии: русско-санскритские упражнения могут иметь кнауэровских двойников, которых сверка не видит)"
      - "В самом Nr.13 — весь формальный инвентарь урока одним текстом: varṣiṣyati/gamiṣyāmaḥ/vinaçiṣyati/utsrakṣyanti/ācariṣyanti/vikreṣyanti/bhakṣayiṣyanty/pāsyanti (простое будущее), dātā/yātā (описательное будущее — именной predicative!), abhaviṣyat ×2 (conditionalis) — живая триада будущих времён в одной фразе"
      - "matches.json: 0 совпадений на урок XLIV (честно) — разрежение после плотных XLII–XLIII объяснимо: упражнение русскоязычное"
    corpus_layer:
      - "yā — yāsyāmi (топ-100, DCS 5 103, ранг 81; Rām 16,30.2 «я уйду в лес…») — простое будущее, HB-58-смежно"
      - "dṛś — drakṣyāmi (топ-100, DCS 14 755, ранг 27; Rām Su 12,41) — простое будущее, HB-58-смежно"
    topics:
      - key: future-periphrastic-tar-as
        title: "Описательное будущее: от всех корней; Им. п. sing./du./pl. nominis actoris на tṛ + спрягаемые формы настоящего as (1–2 л. всех чисел, 3 л. — форма опускается); перед tā те же изменения корня, что перед tum инфинитива (ур. XXX): gai gātā, ji jetā, nī netā, stu stotā, bhū bhavitā, kṛ kartā, tṝ taritā, kath kathayitā; парадигма kṛ: kartāsmi/kartāsvaḥ/kartāsmaḥ (Par.), kartāhe/kartāsvahe/kartāsmahe (Ātm.)"
        buhler_locus: "урок XLIV, п. I.1–2 + парадигма kṛ (mdx 6735–6755)"
        topic_claims: [HB-58, HB-352]
        spots:
          "zalizniak-1978-sec:159": "с внешней стороны равно сочетанию N.sg имени деятеля на -tar-"
          "kochergina-lesson:XIX": "в залоге Ātmanepada as употребляется только в описательном будущем времени и не имеет формы 3-го лица"
          "knauer-fraza:Nr.13": "yo bhikṣāṁ dātā sa svargaṁ yātā"
        exceptions:
          verdict: "CONFIRMED"
          buhler: "B+ — HB-58/352 TRUE/JUSTIFIED: формула «tṛ + as, 3 л. опускается» точна (HB-58 note: order-flag — Бюлер даёт описательное первым, простое вторым); «те же изменения, как перед tum» — корректная отсылка к ур. XXX вместо пересказа (tṝ taritā — двойник taritum), tarīṣyati-вариант — вынесен в список простого будущего"
          whitney: "W+ — §§942-949: перифрастическое будущее (pṛṣ-iṣ); §§942-943 iṣ-основа (kariṣyāmi) vs имя деятеля; §§944-945 обязательные/факультативные списки корней; §942 «3rd sg omits auxiliary» — дословно та же доктрина"
          zalizniak-1978: "Z+ — §159 «Будущее II (или описательное)»: N.sg имени деятеля на -tar- + √as в 1–2 лицах, в 3-м — просто имя деятеля; + «допускает прямое дополнение в винительном падеже» — синтаксическая деталь, которой у Бюлера нет (обратное направление свидетельства)"
          kochergina: "K+ — Занятие XIX: имя деятеля -tar (склонение) + спряжение в описательном будущем + примечание «as в Ā. только в описательном будущем, формы 3-го лица не имеет» — структурное совпадение с Бюлером; живой образец dātar/dātā"
        notes: "Кнауэр Nr.13: «yo bhikṣāṁ dātā sa svargaṁ yātā» — dātā и yātā как сказуемые в N.sg — описательное будущее в живом эпическом тексте (редкая учебная находка серии); Z-1978 §175 п.1 (имя деятеля) — соседний локус Очерка, в TSV не разводим (одна строка §159 несёт оба слоя)"
      - key: future-simple-sya
        title: "Простое будущее: суфф. sya [ṣya] к корню прямо или через i/ī, окончания ind. praes.; подъёмные гласные → guṇa; конечные дифтонги e/ai/o → ā; конечные согласные как в классах II/III/VII перед s-окончаниями: c/j/ś/ṣ/kṣ/h → k (после k sya → ṣya), d/dh → t, bh → p, m/n → anusvāra, s → t; соединительный гласный большей частью как в инфинитиве (ур. XXX): корни на ṛ — всегда i, gam/han — i в Par., vṛt/vṛdh/syand в Par. без i; X класс и каузативы — ayiṣya"
        buhler_locus: "урок XLIV, п. II.1–2а–в + список 25 примеров (mdx 6757–6823)"
        topic_claims: [HB-353, HB-354, HB-355]
        spots:
          "zalizniak-1978-sec:157": "Основа простого будущего времени равна корню в ступени guṇa + sya"
          "kochergina-lesson:XVIII": "образуется от всех глаголов по единому правилу - прибавлением к корню ударяемого суффикса -syá"
          "knauer-fraza:Nr.13": "yadi devo varṣiṣyati vayaṁ bahir na gamiṣyāmaḥ"
