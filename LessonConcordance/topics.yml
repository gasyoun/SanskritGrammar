# topics.yml — controlled topic vocabulary + per-topic curation notes for LessonConcordance
#
# Hand-curated sidecar consumed by scripts/build_lesson_concordance.py (do not edit
# catalog.mdx by hand — re-run the generator). Topic keys are versioned: adding a key
# is allowed, renaming/moving requires a bump of `version` and a changelog_queue row.
# Exception verdicts encode the per-topic answer to MG's hypothesis (01-10-2026):
# «списки исключений — у Бюлера много, у Зализняка-1978 нет, у Уитни всегда?»
# Each verdict cites loci; the hypothesis is tested per lesson-topic as lessons land.

version: 1
hypothesis: "MG 01-10-2026: Bühler carries long exception lists; Zaliznyak-1978 does not; Whitney always does"
