  XLVII:
    title: "Сигматический аорист VII (sa) и пассивный аорист (VIII): седьмой — основа корень+sa [ṣa], P. и Ā., спряжение как impf. I класса, корни на ś/ṣ/h с i/u/ṛ (diś adikṣam…adikṣan / adikṣe…adikṣanta; конечные по XLIV, 2б; sa-отбрасывание guh/dih/duh/lih в 2–3 sg, 1 du., 2 pl. Ā.); пассивный — лица кроме 3 sg тожественны Ā. аористов IV/V/VII, X-класс/каузативы/seṭ-корни → iṣ-аорист с aya-опцией; 3 sg на -i (частейшая форма) — шесть классов изменения корня (y-вставка после ā: adāyi; vṛddhi конечных: anāyi/aśrāvi/akāri; guṇa начальных/внутренних: alehi/adohi/adarśi; удлинение предпоследнего a с am-исключением (adami) и re-рядом kam/gam/nam/yam/ram/vam/ācam (agāmi); aya-отбрасывание X/каузативов: acori/abhedi; неправильные jan ajani, labh alābhi/alambhi (после приставок только alambhi), han aghāni); ciṇvad-расширение — корни на гласные + grah/dṛś/han образуют остальные формы от 3 sg-основы окончаниями V-вида Ā (dā adiṣi/adāyiṣi; kṛ akṛṣi/akāriṣi; dṛś adṛkṣi/adarśiṣi; grah agrahīṣi/agrāhiṣi; han ahasi/aghāniṣi); пассивные перфект/будущее/conditionalis/precativus — Ā-окончаниями + особые основы от 3 sg аориста (kṛ kartā/kāritā, kariṣye/kāriṣyate, akariṣyata/akāriṣyata, kṛṣīṣṭa/kāriṣīṣṭa)"
    mdx: "BuhlerLeitfaden_1923/Buhler_Unicode.mdx, строки 7131–7199 (заголовок «# УРОК XLVII» — без точки на конце, единственный кривой делимитер зоны XLVI–XLVIII после жирного урока V; дальше урок XLVIII — обычный заголовок, mdx 7201). Русско-санскритского упражнения нет (прецедентный косой случай 43–47) — вместо него хрестоматийный текст «шакал и коза в колодце» (mdx 7199) с живыми пассивными аористами (avāci — vac, acinti — cint, anu-ṣṭhā; будущее пассивное uddhariṣyāmi — uddhar; кондитив avatar), фиксируем честно; corpus_layer — 0 строк (честно)"
