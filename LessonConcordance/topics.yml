        notes: "Кнауэр Nr.17 — живая пара дезидеративов: na 'çuçrūṣata (отрицание при дезидеративе śru!) и деванагари-строка satyaṃ cikīrṣamāṇastu dhārayāmāsa hṛcchayam = MBh 3,52 дословно (снапшот DCS: satyaṃ cikīrṣamāṇas tu dhārayāmāsa hṛcchayam, sent_id 192684) — упражнение = живой корпус, класс находок XLIV; bubutsate (budh, парадигма урока) — 0 токенов в снапшоте: парадигмальная форма вне аттестации, фиксируем честно; так само so siṣāsati — стяжённая печать (ср. Уитни §1030-территория: дезидератив as «бросать») — однозначная привязка строки реестра невозможна, в лемма-слой через as (wh23) с пометкой"
      - key: intensive-two-types
        title: "Интенсивы (фреквентативы), два типа: все односложные согласнопервичные корни I–IX классов (сноска-исключения: aṭ aṭāṭyate, ṛ ararti/ariyarti/arāryate, aś aśāśyate); I — исключительно удвоение, исключительно P., спряжение III класса или с ī перед согласными окончаниями; II — суффикс ya (изменения как перед страдательным залогом, ур. X) + удвоение полученной основы, исключительно Ā., спряжение IV класса; семантика: повторение действия; глаголов «идти» — движение по кривой линии, у некоторых — «действие совершается плохо»; вне презенса — крайне редко (по индийским грамматикам: perf. periphrast, futura, conditionalis с i, precat., пассив); парадигма-таблица 17 корней × P/Ā (dā dādāti/dādeti | dedīyate … vṛt varvartti/varīvṛtīti | varīvṛtyate)"
        buhler_locus: "урок XLVIII, п. II.1–4 + таблица (mdx 7319–7369)"
        topic_claims: [HB-63, HB-399, HB-400, HB-401, HB-402]
        spots:
          "zalizniak-1978-sec:170": "делать А усиленно или часто"
          "zalizniak-1978-sec:133": "также интенсивы"
          "kochergina-lesson:XXXVIII": "выражают повторяемость или интенсивность"
          "knauer-fraza:Nr.17": "rorūyamāṇo"
        exceptions:
          verdict: "CONFIRMED (HB-400 — UNTESTABLE отдельно)"
          buhler: "B+ — HB-63/399/401/402 TRUE/JUSTIFIED: одно-залоговость I (P) и II (Ā) — дефиниция типов, абсолюты безопасны (witness HB-2-сравнение); HB-399 с собственной сноской-исключениями (aṭāṭyate, ararti/ariyarti/arāryate, aśāśyate) — вокальноначальные утечки, честно заявленные; HB-400 UNTESTABLE: «криволинейное движение/плохое действие» — faithfully Pāṇini 3.1.23-24 (kauṭilya/garhā), но без семантического тегирования корпусом не проверяется — программа-гэп, не ошибка Бюлера"
          whitney: "W+ — §§1000-1017: §1001 многосложные исключены, §1002e вокальноначальные — лишь i и ṛ, «very rare» в позднем языке (HK-37 AGREE); §1002а «тяжёлое» удвоение (ā/e/o/ar/al/am/an); §1016-1017 ya-интенсив — средние окончания, в позднем языке обычнее; §1018-1019 вне-презенсные практически не встречаются (HB-402)"
          zalizniak-1978: "Z+ — §170: «делать А усиленно или часто», «тяжёлое» удвоение, «употребляются довольно редко, причем преимущественно в med. и практически только в презенсе»; пример rorūyate «вопит» от √ru — точный корень Кнауэра Nr.17; §133: спряжение III класса, факультативное ī (dardar-mi/dardar-īmi), bobhujīti; §234: ударение róravīti/rorūyá-"
          kochergina: "K+ — Занятие XXXVIII: «только от односложных корней, начинающихся с согласной», «встречаются редко» — HK-37 AGREE; параллель §1002e-ограничения"
        notes: "Корпусная рамка редкости: rorūy — 38 токенов в 16 файлах снапшота против 290–1218 у дезидеративов — на порядок реже, живое подтверждение HB-402; Кнауэр Nr.17 — çvā rorūyamāṇo «собака, воя, бежала к матери» — интенсив II в живой фразе, та же основа, что пример З-1978 §170 и Bhāgavatapurāṇa 3, 31; таблица урока сама показывает стяжения (soṣupyate от svap — sv→so), «плохое действие» в таблице не маркировано — семантический слой остаётся за словарём, честно; witness HK-205 AGREE («тяжёлое» удвоение = guṇa-ряд, терминологическая разница с Уитни) и HK-206 AGREE (средние окончания, §1016-1017)"
      - key: denominativa
        title: "Отыменные глаголы: суффиксы ya, aya, āpaya («делать[ся] тем-то, то-то желать»), sya/asya («того-то сильно желать») или непосредственное присоединение глагольных окончаний к имени («вести себя так-то»); наиболее часты первые два способа; примеры: tapas tapasyati каяться, namas namasyati почитать, kalaha kalahāyate ссориться, kṛṣṇa kṛṣṇayate делать черным, unmanas unmanāyate выходить из себя, muṇḍa muṇḍayati остригать наголо, laghu laghayati подымать, dṛḍha draḍhayati закреплять, satya satyāpayati объявлять правильным"
        buhler_locus: "урок XLVIII, п. III (mdx 7371–7391)"
        topic_claims: [HB-403]
        spots:
          "zalizniak-1978-sec:172": "отыменных (деноминативных)"
          "kochergina-lesson:XXXV": "производные от имен существительных"
          "knauer-fraza:Nr.17": "kṛṣṇāyate"
        exceptions:
          verdict: "CONFIRMED-WITH-NUANCE"
          buhler: "B+ — HB-403 TRUE/JUSTIFIED: «наиболее часто первые два» — направление подтверждается обзором Уитни (-ya- крупнейший класс, -aya- продуктивный классический соперник; āpaya/sya/asya и безсуффиксный тип маргинальны); suffix-ценз по derivation-тегированию в разрешённом корпусе отсутствует — честный направление-вердикт"
          whitney: "W+ — §§1053-1068: систематика деноминативов, -ya/-aya-частотность, §1059-1063 обработка финалей (a остаётся/удлиняется/→ī, i/u→ī/ū, согласный остаётся — namasyáti); witness causative:151 AGREE: класс X на -aya — «intermediate between them and the proper denominatives»"
          zalizniak-1978: "Z+ — §172: значения при исходном имени А: выступать в качестве А, быть как А, делать/создавать А, делать таким, как А, применять А — семантическая решётка сверх урока; формальная сторона (суффиксы) — у З-1978 сжато, honest spread"
          kochergina: "K+ — Занятие XXXV: основа = имя + -yá; финали: i/u обычно удлиняются, a удлиняется или →ī, ar → rī — HK-200 AGREE (OCR-сдвиг «1058» в mdx зафиксирован свидетелем)"
        notes: "Кнауэр Nr.17 — kṛṣṇāyate «чернеет» (uṣṇo dahaty aṅgāraḥ çītaḥ kṛṣṇāyate karam) — живой деноминатив того же корня-имени kṛṣṇa, что пример урока; 9 пар имя→глагол урока — все отыменные без глагольного корня, в лемма-слой (глагольные реестры) не попадают — фиксируем честно; witness HK-200 (Занятие XXXV) AGREE — единственная «прочая» строка 4-witness сетки по теме"
