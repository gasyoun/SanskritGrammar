  XLV:
    title: "Аорист (A), корневые: первый — окончания без соед. гласной как impf. II кл., только Parasmaipada (dā adām/adāva/adāma, adāḥ/adātam/adāta, adāt/adātām/aduḥ; bhū abhūvam…abhūvan «неправильно»; примеры dhā adhāt, sthā asthāt, pā apāt, i agāt); второй — как impf. VII кл. [опечатка: VI кл., HB-60/errata], P. и Ā. (sic asicam/asicāva/asicāma, Ā asice/asicāvahi/asicāmahi; средние носовые выпадают abhraśat/asrasat, конечный ṛ→guṇa; āp āpat, gam agamat, bhraṅś abhraśat, muc amucat, śak aśakat, sad asadat, sraṅs asrasat; неправильные as āsthat, khyā akhyat, dṛś adarśat, śās aśiṣat, śvi aśvat, hve ahvat); третий — imperf. с удвоением по примеру VI кл., P. и Ā. (śri aśiśriyam/aśiśriyāva…, Ā aśiśriye; dru adudruvat, sru asusruvat, kam acakamat, śvi aśiśviyat, dhe adadhat; неправильные vac avocat, pat apaptat); от X кл. и каузативов — только третий: aya всегда отбрасывается, кластер-исход → правила удвоения перфекта (ararakṣat, acakathat), внутренние гунированные → исходный гласный (avīvṛtat/avavartat), ā→a, ī/ū→i/u факультативно, vṛddhi конечных → guṇa, ī/i-ритм при краткой основе (adīdamat vs acikṣipat), гласноначальные удваивают конечный согласный [опечатка: «гласный», HB-372/errata] с вставкой i (āśiśat, arjijat, aicikṣat); неправильные ajagaṇat/ajīgaṇat, atiṣṭhipat, asūṣupat; финальное замечание: с mā аористы лишаются приращения и заменяют императив (mā dāḥ, mā bhaiṣīḥ — инъюнктив), а сами в классике — редкие прошедшие, равноправные с перфектом и импфектом"
