# topics.yml — controlled topic vocabulary + per-topic exception-coverage notes
# для LessonConcordance (H5595, план BUHLER_LESSON_CONCORDANCE_PLAN_2026.md, D2/D13).
#
# Словарь тем (D13): версия 1 = 41 категория form_section_concordance.json
# (спайн) + расширяемые ключи. Ключ темы — kebab-case, входит в anchor
# buhler-topic:<RN>.<topic> (TYPED_LINK_ID_GRAMMAR.md §2). Новая тема = новая
# запись ниже с полем spine (ссылка на категорию спайна) или spine: none
# (расширение словаря — версия увеличивается в meta.version).
#
# Поле exception_coverage отвечает гипотезу MG (голос D2, 01-10-2026):
# «списки исключений — много у Бюлера, нет у Зализняка-1978, всегда у Уитни?» —
# per-topic, с цитатами локусов. Каждая цитата списана из файла-источника в
# этом репо (путь/строки указаны) и проверяется DeepSeek-спот-чеком.
meta:
  version: 1
  created: 01-10-2026
  vocabulary_note: "41 категория спайна покрывают морфологию; фонетика/сандхи — расширение v1 (spine: none)"

topics:
  present-a:
    spine: present_a   # 41-категорийный спайн, Whitney §§733-750 (Present, a-class I / bhū-class)
    label_ru: "Настоящее время, I класс (тематические основы на -a)"
    buhler_locus: "BuhlerLeitfaden_1923/Buhler_Unicode.mdx «# УРОК I.» строки 112-252: правило образования (vad → vada/vadā, строка 129), парадигма vadāmi, список 13 корней I класса, упражнения"
    exception_coverage:
      buhler: "НЕТ списка исключений в уроке I — правило дано плоско (13 корней списком, без оговорок о корнях, ведущих себя иначе); единственная оговорка урока — saṃdhi-«обыкновенно» (см. sandhi-visarga)"
      whitney: "ВСЕГДА: §§733-750 идут с попримечаниями по отдельным корням и отклонениям; для сандхи-правил — языковая оговорка исключений прямо в правиле (§171a, цитата в sandhi-visarga)"
      zalizniak_1978: "ОТСУТСТВУЮТ как списки по индийским классам: индийских классов в очерке нет, §114 вводит дихотомию тематическое/атематическое спряжение («основа презенса оканчивается на a» — Zalizniak-Ocherk_29-11-20-aligned.mdx, span#s114); расхождение по классу конкретного корня всплывает не списком исключений, а морфонологической классификацией 1975 г. (ряд/класс в crosswalk)"
      kochergina: "ОТСУТСТВУЮТ в Занятии VIII — и более того, само образование основ отложено: «О способах образования основ настоящего времени (о.н.в.) речь будет идти позже (см. Занятия XV-XVII)» (Kochergina_unicode.mdx строка 1472); занятие VIII даёт окончания и парадигму без классной теории"
    lemma_coverage:
      corpus_layer: "ПУСТО для урока I: BuhlerLeitfaden_1923/corpus_layer/corpus_layer.tsv покрывает уроки XVIII, XXVIII, XXXIV, XXXVIII, XLIII-XLV (плюс 5 строк-мусора «управление») — урок I без леммных строк; разрыв зафиксирован, не замазан"
      roots: "13 корней урока сшиты с WhitneyRoots/crosswalk/roots.csv (класс по Уитни, частота/ранг DCS) и TolchelnikovTalmud_2026/data/morphoclass_crosswalk_1975-2014-2026 (ряд/класс З-1975) — таблица на catalog.mdx"
      vas_homonym_finding: "ОМОНИМИЯ РАЗРЕШЕНА (пилотная проверка): «vas - жить, обитать» = vas-3 (roots.csv №717, gloss «dwell», класс I) — класс-I чтение подтверждена ростером; омонимы vas-1 «shine» / vas-2 «clothe» (№715/716, классы II|VI) к уроку I не относятся; форма vasāvaḥ из упражнений — от основы «dwell»"

  sandhi-visarga:
    spine: none       # расширение v1: фонетика/сандхи вне 41 морфологической категории
    label_ru: "Сандхи: конечные s/r → висарга"
    buhler_locus: "BuhlerLeitfaden_1923/Buhler_Unicode.mdx «# УРОК I.» правило 2 (строка ~131): «Конечные s и r слов, стоящих в конце предложений, всегда превращаются в висаргу, : = ḥ, обыкновенно также и перед k, kh, p, ph и перед шипящими [ś, ṣ, s]»"
    exception_coverage:
      buhler: "ОГОВОРКА В ПРАВИЛЕ: «всегда» (пауза) + «обыкновенно также и перед k, kh, p, ph и перед шипящими» — штатный список позиций с наречным кустарем «обыкновенно», но без списка исключений в уроке I"
      whitney: "ВСЕГДА, и явно: §170a «The स् s … becomes visarga before a pause. b. It is retained unchanged only when followed by त् t or थ् th…»; §171a: «The first three of these rules are almost universal; to the last one there are numerous exceptions…»; §173 «There are one or two exceptions…» (WhitneyGrammar_1889/03_Rules_of_Euphonic_Combination.mdx)"
      zalizniak_1978: "НЕ ОТСУТСТВУЮТ (вопреки гипотезе): правила внешних сандхи §§32-46, и исключение выписано списком — «Исключение из §§ 41 и 42. Не подвергаются внешним сандхи: а) конечные ī, ū, е в словоформах двойственного числа имен и глаголов (а также в ami, § 105); б) конечные гласные междометий и конечное o…» (Zalizniak-Ocherk_29-11-20-aligned.mdx строка 606)"
      kochergina: "ПРАВИЛО ЕСТЬ, списка исключений НЕТ: Занятие VI, строки 1259-1265 — «В конце предложения или стихотворной строки -s и -r изменяются в висаргу ḥ» + «в висаргу перед k, kh, p, ph, ś, ṣ, s: prathamaḥ sargaḥ…» — тот же охват, что у Бюлера, без исключений (Kochergina_unicode.mdx)"
