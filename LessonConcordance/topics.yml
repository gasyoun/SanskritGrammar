          kochergina: "K± — Занятие XIX п.3: conditionalis есть — «нереальное действие… в обеих частях условного предложения», аугмент a- с ударением (пример от kar) — слой закрыт, даже шире Бюлера (обе части); причастия простого будущего в Занятии XIX не проговорены — honest gap причастной половины"
        notes: "конвергенция формулировки «в обеих частях» — Кочергина Занятие XIX и Очерк §109 дословно совпадают, у Бюлера и Уитни только протасис; Кнауэр Nr.13: «suvṛṣṭiç ced abhaviṣyat tadā subhikṣam abhaviṣyat» — conditionalis в обеих частях (протасис + аподосис) — живая иллюстрация конауэровской же фразы; HB-58 note: порядок подачи будущих времён (Бюлер: описательное → простое) — условная ось 4 свидетелей"
      - key: benedictive-precative
        title: "Прекатив (benedictivus/precativus): P. суфф. yās, Ā. — sī [ṣī], спряжение как pot. классов II/III/V/VII-IX; P. изменения как перед ya пассива (ур. X), но гласные dā/dhā/mā/sthā/pā/hā/dhe/gai/so/do всегда → e (deyāt; ji jīyat, śru śrūyāt, kṛ kriyāt, smṛ smaryāt, tṝ tīryāt, pṝ pūryāt, hve huyāt, śās śiṣyāt, vah uhyāt, vas uṣyāt); i → īyāt, но с приставками iyāt (udiyāt); Ā. соединительный гласный как в инфинитиве (ṛ-корни и vṛ — факультативно; ī только у grah); без соединительного: конечные i/ī/u → guṇa, ṝ → īr/ūr (после губных), дифтонги → ā, согласные как в простом будущем; X класс/каузативы — ayiṣī; парадигма dā: deyāsam/deyāḥ/deyāt (Par.), dāsīya/dāsīṣṭhāḥ/dāsīṣṭa (Ātm.); сноска: dhvam → ḍhvam при тех же условиях, что dhve → ḍhve (XLIII, 4г)"
        buhler_locus: "урок XLIV, п. V.1–3 + парадигма dā + сноска ḍhvam (mdx 6845–6903)"
        topic_claims: [HB-358, HB-359, HB-360, HB-361, HB-362]
        spots:
