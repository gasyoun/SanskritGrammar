        buhler_locus: "урок XXII, §3 (mdx 2914–2943): as/is/us → o/ir/ur перед bh; Loc.pl. — as сохраняется или висарга у всех трёх; iṣ/uṣ перед гласными; N.sg. — висарга; N.V.Acc.pl. — āṅsi/īṅṣi/ūṅṣi; §3б (mdx 2944): м./ж. на as — sumanāḥ в N., aḥ в V., на is/us — iḥ/uḥ без удлинения"
