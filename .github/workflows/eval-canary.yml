name: eval canary

on:
  pull_request:
    paths:
      - "evals/**"
      - "data/ud_sanskrit/**"
      - "tools/verify_claims_ud.py"
  push:
    branches: [main]
    paths:
      - "evals/**"
      - "data/ud_sanskrit/**"
      - "tools/verify_claims_ud.py"

permissions:
  contents: read

jobs:
  ud-claims-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Probe replay + mutation must fail
        run: python evals/run_eval.py --canary
