name: Consolidation ledger nightly refresh

# The `consolidation_ledger_refresh.py --check` gate in ci.yml compares DATE
# STAMPS, so the ledger goes stale by the calendar alone: `main` turns red
# with no code change, and every open PR is red-gated with it. On 16-09-2026
# that is exactly what had happened -- the required gate had been failing on
# `main` since 15-09 and was blocking all 8 open PRs, and the entire content
# diff of the fix was `2026-09-06` -> `2026-09-16` across 27 stamps.
#
# MG ruling 16-09-2026: move the regeneration into a nightly job rather than
# loosening the gate. The gate keeps its meaning (the ledger in the tree must
# match what the generator produces); a robot, not a human, pays the daily
# cost of keeping that true.
#
# Delivery is PR-first, matching the repo's posture: this job never pushes to
# `main` directly. A no-op night opens nothing at all. Since H7967 the
# delivery is ONE refresh-owned rolling branch (`chore/ledger-refresh`) with
# ONE open PR: later changed runs replace the single generator-owned commit
# via --force-with-lease and update the SAME PR, instead of minting a dated
# branch + PR per night. The idempotent orchestration (with the single-file
# scope guard and the never-touch-unowned-branches lease) lives in
# scripts/consolidation_ledger_pr_orchestrate.py, proven offline by
# tests/test_consolidation_ledger_pr_orchestrate.py.

on:
  schedule:
    # 03:17 UTC daily, deliberately off the hour -- the top of the hour is the
    # most contended slot on shared runners.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: consolidation-ledger-nightly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install locked Python environment
        run: uv sync --frozen

      - name: Refresh the ledger
        run: uv run python scripts/consolidation_ledger_refresh.py

      - name: Verify the refresh actually satisfies the gate
        run: uv run python scripts/consolidation_ledger_refresh.py --check

      # Idempotent bot-owned PR orchestration (H7967): ONE refresh-owned
      # rolling branch (chore/ledger-refresh) and ONE open PR. A changed run
      # creates the branch/PR once and later changed runs replace the single
      # generator-owned commit via --force-with-lease, updating the SAME PR;
      # a no-change run opens nothing. The single-file scope guard and the
      # never-touch-unowned-branches lease live in the orchestrator, proven
      # offline by tests/test_consolidation_ledger_pr_orchestrate.py.
      - name: Orchestrate the rolling refresh PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run python scripts/consolidation_ledger_pr_orchestrate.py
