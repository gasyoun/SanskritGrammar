name: Consolidation ledger nightly refresh

# The `consolidation_ledger_refresh.py --check` gate in ci.yml compares DATE
# STAMPS, so the ledger goes stale by the calendar alone: `main` turns red
# with no code change, and every open PR is red-gated with it. On 16-09-2026
# that is exactly what had happened -- the required gate had been failing on
# `main` since 15-09 and was blocking all 8 open PRs, and the entire content
# diff of the fix was `2026-09-06` -> `2026-09-16` across 27 stamps.
#
# MG ruling 16-09-2026: move the regeneration into a nightly job rather than
# loosening the gate. The gate keeps its meaning (the ledger in the tree must
# match what the generator produces); a robot, not a human, pays the daily
# cost of keeping that true.
#
# Delivery is PR-first, matching the repo's posture: this job never pushes to
# `main` directly. A no-op night opens nothing at all.

on:
  schedule:
    # 03:17 UTC daily, deliberately off the hour -- the top of the hour is the
    # most contended slot on shared runners.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: consolidation-ledger-nightly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install locked Python environment
        run: uv sync --frozen

      - name: Refresh the ledger
        run: uv run python scripts/consolidation_ledger_refresh.py

      - name: Verify the refresh actually satisfies the gate
        run: uv run python scripts/consolidation_ledger_refresh.py --check

      - name: Decide whether anything changed
        id: diff
        run: |
          if git diff --quiet -- sangram/editorial/data/consolidation_ledger.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Ledger already current - nothing to open." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "### Ledger refreshed" >> "$GITHUB_STEP_SUMMARY"
            git diff --stat -- sangram/editorial/data/consolidation_ledger.json >> "$GITHUB_STEP_SUMMARY"
          fi

      # Guard rail: this job owns exactly one generated file. If the refresh
      # script ever starts writing elsewhere, stop rather than open a PR whose
      # scope nobody reviewed.
      - name: Refuse an out-of-scope diff
        if: steps.diff.outputs.changed == 'true'
        run: |
          unexpected="$(git diff --name-only | grep -v '^sangram/editorial/data/consolidation_ledger\.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::refresh touched files outside the ledger:"
            echo "$unexpected"
            exit 1
          fi

      - name: Open the PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="chore/ledger-refresh-$(date -u +%Y%m%d)"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "Branch $branch already exists - today's refresh already went out."
            exit 0
          fi
          {
            echo "Generated by .github/workflows/consolidation-ledger-nightly.yml."
            echo
            echo "The ci.yml gate compares date stamps, so the ledger goes stale by"
            echo "the calendar; this keeps the required check green without spending"
            echo "a human pass on it."
          } > "$RUNNER_TEMP/ledger_commit_body.txt"
          {
            echo "Automated nightly refresh. The consolidation_ledger_refresh.py --check gate in ci.yml compares date stamps, so the ledger goes stale by the calendar and reds main with no code change."
            echo
            echo "Scope is enforced by the workflow: the run fails rather than opening a PR if the refresh touches anything outside sangram/editorial/data/consolidation_ledger.json."
            echo
            echo "Merging this is routine. A substantive diff here - anything beyond date stamps - means the generator's inputs changed and deserves a real look."
          } > "$RUNNER_TEMP/ledger_pr_body.md"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add sangram/editorial/data/consolidation_ledger.json
          git commit -m "chore(sangram): nightly consolidation_ledger.json refresh" \
                     -m "$(cat "$RUNNER_TEMP/ledger_commit_body.txt")"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(sangram): nightly consolidation_ledger.json refresh" \
            --body-file "$RUNNER_TEMP/ledger_pr_body.md"
          gh pr merge --auto --squash "$branch" \
            || echo "::warning::auto-merge not enabled; merge by hand when green"
